apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restauranty-ingress
  namespace: restauranty

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: webapprouting.kubernetes.azure.com

  tls:
    - hosts:
        - restauranty-tatiana.duckdns.org
      secretName: restauranty-tls

  rules:
    - host: restauranty-tatiana.duckdns.org
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3001

          - path: /api/discounts
            pathType: Prefix
            backend:
              service:
                name: discounts
                port:
                  number: 3002

          - path: /api/items
            pathType: Prefix
            backend:
              service:
                name: items
                port:
                  number: 3003
          
          - path: /api/assistant
            pathType: Prefix
            backend:
              service:
                name: assistant
                port:
                  number: 8000
                  
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
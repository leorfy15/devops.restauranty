apiVersion: apps/v1
kind: Deployment
metadata:
  name: restauranty-items
  namespace: restauranty
spec:
  replicas: 2

  selector:
    matchLabels:
      app: restauranty-items

  template:
    metadata:
      labels:
        app: restauranty-items

    spec:
      containers:
        - name: items

          image: acrrestaurantytatiana.azurecr.io/restauranty-items:v1

          ports:
            - containerPort: 3003

          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/Restauranty"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: items
  namespace: restauranty
spec:
  selector:
    app: restauranty-items

  ports:
    - port: 3003
      targetPort: 3003

  type: ClusterIP
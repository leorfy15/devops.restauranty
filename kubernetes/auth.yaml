apiVersion: apps/v1
kind: Deployment
metadata:
  name: restauranty-auth
  namespace: restauranty

spec:
  replicas: 2

  selector:
    matchLabels:
      app: restauranty-auth

  template:
    metadata:
      labels:
        app: restauranty-auth

    spec:
      containers:
        - name: auth

          # CI/CD replaces this with the current Git SHA before deployment.
          image: acrrestaurantytatiana.azurecr.io/restauranty-auth:latest

          ports:
            - containerPort: 3001

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/Restauranty"

            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret-kv
                  key: SECRET

          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "restauranty-keyvault"

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: restauranty
  labels:
    app: restauranty-auth

spec:
  selector:
    app: restauranty-auth

  ports:
    - name: metrics
      port: 3001
      targetPort: 3001

  type: ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restauranty-assistant
  namespace: restauranty

spec:
  replicas: 1

  selector:
    matchLabels:
      app: restauranty-assistant

  template:
    metadata:
      labels:
        app: restauranty-assistant

    spec:
      serviceAccountName: restauranty-assistant

      containers:
        - name: assistant
          image: acrrestaurantytatiana.azurecr.io/restauranty-assistant:latest

          ports:
            - containerPort: 8000

          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: assistant-secret-kv
                  key: OPENAI_API_KEY

          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "restauranty-keyvault"
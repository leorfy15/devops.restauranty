name: Build, Scan and Deploy Restauranty

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrrestaurantytatiana
  ACR_LOGIN_SERVER: acrrestaurantytatiana.azurecr.io
  RESOURCE_GROUP: rg-restauranty-dev-tatiana
  AKS_CLUSTER: aks-restauranty-dev
  NAMESPACE: restauranty

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME


      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "Image tag: ${GITHUB_SHA::7}"


      # AUTH

      - name: Build Auth image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/restauranty-auth:$IMAGE_TAG \
            ./backend/auth


      - name: Scan Auth image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/restauranty-auth:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'


      - name: Push Auth image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/restauranty-auth:$IMAGE_TAG


      # DISCOUNTS

      - name: Build Discounts image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/restauranty-discounts:$IMAGE_TAG \
            ./backend/discounts


      - name: Scan Discounts image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/restauranty-discounts:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'


      - name: Push Discounts image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/restauranty-discounts:$IMAGE_TAG


      # ITEMS

      - name: Build Items image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/restauranty-items:$IMAGE_TAG \
            ./backend/items


      - name: Scan Items image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/restauranty-items:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'


      - name: Push Items image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/restauranty-items:$IMAGE_TAG


      # ASSISTANT

      - name: Check Assistant Python syntax
        run: |
          python3 -m py_compile backend/assistant/app.py


      - name: Build Assistant image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/restauranty-assistant:$IMAGE_TAG \
            ./backend/assistant


      - name: Scan Assistant image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/restauranty-assistant:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'


      - name: Push Assistant image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/restauranty-assistant:$IMAGE_TAG


      # CLIENT

      - name: Build Client image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/restauranty-client:$IMAGE_TAG \
            ./client


      - name: Scan Client image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/restauranty-client:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'


      - name: Push Client image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/restauranty-client:$IMAGE_TAG


      # AKS

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing


      - name: Set Kubernetes image tags
        run: |
          sed -i \
            "s|image: $ACR_LOGIN_SERVER/restauranty-auth:.*|image: $ACR_LOGIN_SERVER/restauranty-auth:$IMAGE_TAG|" \
            kubernetes/auth.yaml

          sed -i \
            "s|image: $ACR_LOGIN_SERVER/restauranty-discounts:.*|image: $ACR_LOGIN_SERVER/restauranty-discounts:$IMAGE_TAG|" \
            kubernetes/discounts.yaml

          sed -i \
            "s|image: $ACR_LOGIN_SERVER/restauranty-items:.*|image: $ACR_LOGIN_SERVER/restauranty-items:$IMAGE_TAG|" \
            kubernetes/items.yaml

          sed -i \
            "s|image: $ACR_LOGIN_SERVER/restauranty-assistant:.*|image: $ACR_LOGIN_SERVER/restauranty-assistant:$IMAGE_TAG|" \
            kubernetes/assistant.yaml

          sed -i \
            "s|image: $ACR_LOGIN_SERVER/restauranty-client:.*|image: $ACR_LOGIN_SERVER/restauranty-client:$IMAGE_TAG|" \
            kubernetes/client.yaml


      - name: Apply shared Kubernetes configuration
        run: |
          if [ -f kubernetes/secretproviderclass.yaml ]; then
            kubectl apply -f kubernetes/secretproviderclass.yaml
          fi


      # DEPLOY AUTH

      - name: Deploy Auth
        run: |
          echo "Deploying Auth..."

          kubectl apply -f kubernetes/auth.yaml

          kubectl rollout status deployment/restauranty-auth \
            -n $NAMESPACE \
            --timeout=300s


      # DEPLOY DISCOUNTS

      - name: Deploy Discounts
        run: |
          echo "Deploying Discounts..."

          kubectl apply -f kubernetes/discounts.yaml

          kubectl rollout status deployment/restauranty-discounts \
            -n $NAMESPACE \
            --timeout=300s


      # DEPLOY ITEMS

      - name: Deploy Items
        run: |
          echo "Deploying Items..."

          kubectl apply -f kubernetes/items.yaml

          kubectl rollout status deployment/restauranty-items \
            -n $NAMESPACE \
            --timeout=300s


      # DEPLOY ASSISTANT

      - name: Deploy Assistant
        run: |
          echo "Deploying AI Assistant..."

          kubectl apply -f kubernetes/assistant.yaml

          kubectl rollout status deployment/restauranty-assistant \
            -n $NAMESPACE \
            --timeout=300s


      # DEPLOY CLIENT

      - name: Deploy Client
        run: |
          echo "Deploying Client..."

          kubectl apply -f kubernetes/client.yaml

          kubectl rollout status deployment/restauranty-client \
            -n $NAMESPACE \
            --timeout=300s


      # HPA AND INGRESS

      - name: Apply HPA and Ingress
        run: |
          if [ -f kubernetes/hpa.yaml ]; then
            kubectl apply -f kubernetes/hpa.yaml
          fi

          kubectl apply -f kubernetes/ingress.yaml


      # VERIFY

      - name: Verify deployed images
        run: |
          echo "Deployed Restauranty images:"

          kubectl get deployment \
            restauranty-auth \
            restauranty-discounts \
            restauranty-items \
            restauranty-assistant \
            restauranty-client \
            -n $NAMESPACE \
            -o 'custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image'


      - name: Show deployment status
        run: |
          echo ""
          echo "PODS"
          kubectl get pods -n $NAMESPACE

          echo ""
          echo "DEPLOYMENTS"
          kubectl get deployments -n $NAMESPACE

          echo ""
          echo "HPA"
          kubectl get hpa -n $NAMESPACE || true

          echo ""
          echo "INGRESS"
          kubectl get ingress -n $NAMESPACE

          echo ""
          echo "AI ASSISTANT"
          kubectl get deployment restauranty-assistant \
            -n $NAMESPACE

          kubectl get svc assistant \
            -n $NAMESPACE